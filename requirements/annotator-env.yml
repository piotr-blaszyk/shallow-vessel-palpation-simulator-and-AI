# Micromamba environment for the annotation viewer (docker/annotate_data.sh).
#
# This env exists for exactly one job: running the two interactive annotation
# browsers on bare metal, outside Docker. That matters because the browsers are
# GUI tools you drive by hand, frame by frame, and pushing 1080p frames through
# Docker's forwarded X socket makes them choppy enough to be unusable as a
# debugging tool.
#
# It is deliberately tiny. The annotation viewers only decode video, draw
# circles and text, and read/write pickles and npz files - so they need numpy,
# PySide6, PyAV and OpenCV, and nothing else. In particular there is NO torch,
# NO torch-geometric and NO taichi here: none of the model or simulator stack is
# reachable from these tools, and leaving it out is what keeps the env at a few
# hundred MB and a ~1 minute install instead of several GB.
#
# Create it with (from the repository root):
#
#     micromamba env create -f requirements/annotator-env.yml
#
# `docker/annotate_data.sh` activates this env automatically when it is present.
#
# THE GUI IS Qt, NOT OPENCV. The viewers' windows are PySide6 (see
# difftactile/main/qt_viewer.py), which is what makes them native Wayland
# clients. This has two consequences for this file:
#
#   * OpenCV is now the `-headless` wheel, and that is correct. It is used only
#     for image operations (resize, circle, colour handling); it opens no
#     windows, so the GUI-capable build - and the pile of xcb/xorg system
#     libraries its bundled Qt5 plugin linked against - are no longer needed.
#     Earlier revisions of this file insisted on `opencv-python`; that
#     requirement is gone, not relaxed.
#   * The PySide6 wheel bundles its own Qt, including the wayland platform
#     plugins, so no Qt system packages are required either.
name: vessel-palpation-annotator

channels:
  - conda-forge

dependencies:
  # Python 3.10 matches the rest of the project's supported range (3.9-3.12).
  - python=3.10

  - pip

  - pip:
      # Pinned so a fresh clone reproduces the environment this was tested with.
      - numpy==2.2.6
      # The GUI. Ships the wayland/wayland-egl/xcb Qt platform plugins, so Qt
      # picks Wayland natively and falls back to X11 when that is what is there.
      - PySide6==6.9.1
      # Video decoding. Decodes real frames rather than seeking by keyframe,
      # which is what keeps frame i of a decode equal to frame i of the labels.
      - av==15.1.0
      # Image operations only - no windows, hence the headless wheel.
      - opencv-python-headless==5.0.0.93
      # Not used by the viewers themselves, but imported at module scope by the
      # preprocessing modules the viewer entrypoints live in. Both are small, so
      # installing them is simpler than restructuring those imports.
      - scipy==1.15.3
      - tqdm==4.67.1
